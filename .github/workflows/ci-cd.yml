
name: User CRUD CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Install Dependencies
        run: npm install

      - name: Build Ionic Application
        run: npm run build -- --optimization=false --source-map=false

      - name: Build Docker Image
        run: docker build -t user-crud-app .

      - name: Display Docker Images
        run: docker images
